server {
    listen 80;
    server_name _;
 
    root /usr/share/nginx/html;
    index index.html;
 
    # SPA routing — semua path yang bukan file, arahkan ke index.html
    # Tanpa ini, refresh di /about atau /rsvp akan 404
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    # Cache static assets (JS, CSS, images) — browser nggak perlu download ulang
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
 
    # Jangan cache index.html — supaya update langsung terasa
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}